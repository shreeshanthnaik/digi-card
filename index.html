  <style>
    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-1:         #0a0c14;
      --glass-bg:     rgba(255,255,255,0.05);
      --glass-border: rgba(255,255,255,0.10);
      --glass-hover:  rgba(255,255,255,0.09);
      --accent-1:     #7c6df0;
      --accent-2:     #3ecfcf;
      --text-primary: #f0f0ff;
      --text-muted:   #9ba3c0;
      --radius-card:  20px;
      --radius-btn:   14px;
      --shadow-card:  0 8px 32px rgba(0,0,0,0.45);
      --shadow-glow:  0 0 40px rgba(124,109,240,0.18);
      --ease:         0.22s cubic-bezier(0.4,0,0.2,1);
      --max-w:        440px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-1);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* ── Animated glow orbs ───────────────────────────────────── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }
    .orb-purple {
      width: 520px; height: 520px;
      background: radial-gradient(circle, #7c6df0, transparent 70%);
      top: -130px; left: -130px;
      animation: float-purple 16s ease-in-out infinite alternate;
    }
    .orb-cyan {
      width: 420px; height: 420px;
      background: radial-gradient(circle, #3ecfcf, transparent 70%);
      bottom: -100px; right: -100px;
      animation: float-cyan 20s ease-in-out infinite alternate;
    }
    .orb-pink {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #e040fb, transparent 70%);
      top: 50%; right: -80px;
      animation: float-pink 13s ease-in-out infinite alternate;
      opacity: 0.12;
    }
    @keyframes float-purple { to { transform: translate(70px, 90px) scale(1.18); } }
    @keyframes float-cyan   { to { transform: translate(-60px, -70px) scale(1.12); } }
    @keyframes float-pink   { to { transform: translate(-40px, -50px) scale(1.1); } }

    /* ── Page wrapper ─────────────────────────────────────────── */
    .page {
      position: relative; z-index: 1;
      width: 100%; max-width: var(--max-w);
      display: flex; flex-direction: column; gap: 20px;
    }

    /* ── Glass card ─────────────────────────────────────────── */
    .card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      box-shadow: var(--shadow-card), var(--shadow-glow);
      padding: 28px 24px;
      transition: box-shadow var(--ease), transform var(--ease);
    }

    /* ── Profile ─────────────────────────────────────────────── */
    .profile { text-align: center; padding: 36px 24px 30px; }

    .avatar-wrap {
      position: relative; display: inline-block; margin-bottom: 20px;
    }
    .avatar-ring {
      position: absolute; inset: -4px; border-radius: 50%;
      background: conic-gradient(var(--accent-1), var(--accent-2), #e040fb, var(--accent-1));
      z-index: 0;
      animation: spin-ring 5s linear infinite;
    }
    .avatar-ring::after {
      content: ''; position: absolute; inset: 3px; border-radius: 50%;
      background: var(--bg-1);
    }
    @keyframes spin-ring { to { transform: rotate(360deg); } }

    .avatar {
      position: relative; z-index: 1;
      width: 114px; height: 114px; border-radius: 50%;
      object-fit: cover; border: 3px solid var(--bg-1);
      display: block;
    }
    .online-dot {
      position: absolute; bottom: 7px; right: 7px; z-index: 2;
      width: 16px; height: 16px; background: #22d55a;
      border-radius: 50%; border: 2.5px solid var(--bg-1);
      animation: pulse-dot 2.2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%,100% { box-shadow: 0 0 0 0 rgba(34,213,90,0.5); }
      50%      { box-shadow: 0 0 0 8px rgba(34,213,90,0); }
    }

    .profile-name {
      font-size: 1.7rem; font-weight: 800; letter-spacing: -0.6px;
      background: linear-gradient(135deg, #fff 30%, var(--accent-2) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 7px;
    }
    .profile-tagline {
      font-size: 0.88rem; color: var(--text-muted);
      font-weight: 400; letter-spacing: 0.4px;
    }

    /* ── Save Contact button ─────────────────────────────────── */
    .btn-save {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 16px;
      border-radius: var(--radius-btn);
      background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 100%);
      color: #fff; font-family: 'Inter', sans-serif;
      font-size: 1rem; font-weight: 700;
      text-decoration: none; letter-spacing: 0.2px;
      border: none; cursor: pointer;
      box-shadow: 0 4px 28px rgba(124,109,240,0.5);
      transition: transform var(--ease), box-shadow var(--ease), filter var(--ease);
      position: relative; overflow: hidden;
    }
    .btn-save::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.14), transparent);
      opacity: 0; transition: opacity var(--ease);
    }
    .btn-save:hover {
      transform: translateY(-2px) scale(1.016);
      box-shadow: 0 8px 36px rgba(124,109,240,0.65);
      filter: brightness(1.08);
    }
    .btn-save:hover::before { opacity: 1; }
    .btn-save:active { transform: scale(0.97); }

    /* ── Section label ───────────────────────────────────────── */
    .section-label {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.8px; color: var(--text-muted);
      margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
    }
    .section-label::after {
      content: ''; flex: 1; height: 1px; background: var(--glass-border);
    }

    /* ── Social grid ─────────────────────────────────────────── */
    .social-grid { display: flex; flex-direction: column; gap: 10px; }

    .btn-social {
      display: flex; align-items: center; gap: 13px;
      padding: 13px 16px; border-radius: var(--radius-btn);
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      color: var(--text-primary); text-decoration: none;
      font-size: 0.92rem; font-weight: 500; font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: transform var(--ease), background var(--ease),
                  border-color var(--ease), box-shadow var(--ease);
      position: relative; overflow: hidden;
    }
    .btn-social .icon-wrap {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-social .btn-label { flex: 1; }
    .category-tag {
      font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.9px; color: rgba(255,255,255,0.35);
      margin-right: 4px;
    }
    .btn-arrow { opacity: 0.35; transition: transform var(--ease), opacity var(--ease); }
    .btn-social:hover {
      background: var(--glass-hover);
      border-color: rgba(255,255,255,0.2);
      transform: translateX(4px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }
    .btn-social:hover .btn-arrow { transform: translateX(3px); opacity: 0.9; }
    .btn-social:active { transform: scale(0.97); }

    /* ── Bio ─────────────────────────────────────────────────── */
    .bio-text {
      font-size: 0.91rem; line-height: 1.8; color: var(--text-muted);
    }

    /* ── Featured work ───────────────────────────────────────── */
    .featured-grid { display: flex; flex-direction: column; gap: 12px; }

    .work-card {
      background: rgba(255,255,255,0.025); border: 1px solid var(--glass-border);
      border-radius: 14px; padding: 18px;
      transition: border-color var(--ease), background var(--ease), transform var(--ease);
    }
    .work-card:hover {
      border-color: rgba(124,109,240,0.45);
      background: rgba(124,109,240,0.07);
      transform: translateY(-2px);
    }
    .work-card-title {
      font-size: 0.97rem; font-weight: 700; color: var(--text-primary); margin-bottom: 6px;
    }
    .work-card-desc {
      font-size: 0.84rem; color: var(--text-muted); line-height: 1.68; margin-bottom: 14px;
    }
    .btn-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 9px;
      background: rgba(124,109,240,0.14); border: 1px solid rgba(124,109,240,0.3);
      color: var(--accent-1); font-size: 0.8rem; font-weight: 600;
      font-family: 'Inter', sans-serif; text-decoration: none;
      transition: background var(--ease), border-color var(--ease), transform var(--ease);
    }
    .btn-link:hover {
      background: rgba(124,109,240,0.28); border-color: var(--accent-1); transform: translateY(-1px);
    }

    /* ── Footer ─────────────────────────────────────────────── */
    .footer {
      text-align: center; font-size: 0.73rem;
      color: rgba(155,163,192,0.4); padding-top: 4px;
    }

    /* ── Icons ────────────────────────────────────────────── */
    .ico    { width: 18px; height: 18px; fill: #fff; flex-shrink: 0; vertical-align: middle; }
    .ico-lg { width: 21px; height: 21px; fill: #fff; flex-shrink: 0; }

    /* ── Ripple ───────────────────────────────────────────── */
    .ripple-host { position: relative; overflow: hidden; }
    .ripple {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transform: scale(0); animation: ripple-go 0.55s linear forwards;
      pointer-events: none;
    }
    @keyframes ripple-go { to { transform: scale(5); opacity: 0; } }

    /* ── Responsive ───────────────────────────────────────── */
    @media (max-width: 360px) {
      .profile-name { font-size: 1.42rem; }
      .btn-save     { font-size: 0.93rem; }
    }
  </style>
</head>

<script>
(function () {
  "use strict";
  var C = CARD;

  /* ─ Page meta ─ */
  document.title = C.name + " — Digital Card";

  /* ─ Profile ─ */
  document.getElementById("profile-name").textContent    = C.name;
  document.getElementById("profile-tagline").textContent = C.tagline;
  var av = document.getElementById("avatar-img");
  av.src = C.avatar;
  av.alt = C.name + " profile photo";

  /* ─ Save Contact button ─ */
  var sb = document.getElementById("save-btn");
  sb.href = C.vcfFile;
  sb.setAttribute("download", C.vcfFile);

  /* ─ Social links ─ */
  var grid = document.getElementById("social-grid");
  C.social.forEach(function (s) {
    var a = document.createElement("a");
    a.href      = s.url;
    a.target    = "_blank";
    a.rel       = "noopener noreferrer";
    a.className = "btn-social ripple-host";
    a.setAttribute("role", "listitem");
    a.setAttribute("aria-label", s.label);

    var wrap = document.createElement("div");
    wrap.className = "icon-wrap";
    wrap.style.background = s.color;
    wrap.innerHTML = '<svg class="ico" aria-hidden="true"><use href="#i-' + s.icon + '"/></svg>';

    var lbl = document.createElement("span");
    lbl.className = "btn-label";
    lbl.textContent = s.label;

    var cat = document.createElement("span");
    cat.className = "category-tag";
    cat.setAttribute("aria-hidden", "true");
    cat.textContent = s.category;

    var arr = document.createElement("span");
    arr.className = "btn-arrow";
    arr.setAttribute("aria-hidden", "true");
    arr.innerHTML = '<svg class="ico"><use href="#i-arrow-right"/></svg>';

    a.appendChild(wrap);
    a.appendChild(lbl);
    a.appendChild(cat);
    a.appendChild(arr);
    grid.appendChild(a);
  });

  /* ─ Bio ─ */
  document.getElementById("bio-text").textContent = C.bio;

  /* ─ Featured Work ─ */
  var fg = document.getElementById("featured-grid");
  C.featured.forEach(function (w) {
    var card = document.createElement("article");
    card.className = "work-card";
    card.innerHTML =
      '<h3 class="work-card-title">' + w.title + '</h3>' +
      '<p  class="work-card-desc">'  + w.description + '</p>' +
      '<a  class="btn-link" href="'  + w.url + '" target="_blank" rel="noopener noreferrer">' +
      '<svg class="ico" aria-hidden="true"><use href="#i-external"/></svg> View Project</a>';
    fg.appendChild(card);
  });

  /* ─ Footer ─ */
  document.getElementById("footer").innerHTML =
    "&copy; " + new Date().getFullYear() + " " + C.name;

  /* ─ Ripple on click ─ */
  document.querySelectorAll(".ripple-host").forEach(function (el) {
    el.addEventListener("click", function (e) {
      var r   = this.getBoundingClientRect();
      var sz  = Math.max(r.width, r.height);
      var rip = document.createElement("span");
      rip.className = "ripple";
      rip.style.cssText = "width:" + sz + "px;height:" + sz + "px;" +
        "left:" + (e.clientX - r.left - sz / 2) + "px;" +
        "top:"  + (e.clientY - r.top  - sz / 2) + "px";
      this.appendChild(rip);
      setTimeout(function () { rip.remove(); }, 600);
    });
  });
}());
</script>
</body>
</html>
